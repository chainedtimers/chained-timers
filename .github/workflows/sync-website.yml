name: Sync website to chainedtimers.github.io

# Builds the Chained Timers PWA web app (npm run build:www) and mirrors the output
# into the chainedtimers/chainedtimers.github.io repo every time main changes.
#
# ──────────────────────────────────────────────────────────────────────────
# Setup: a fine-grained Personal Access Token with Contents: read and write on
# chainedtimers/chainedtimers.github.io, stored in this repo as WEBSITE_DEPLOY_TOKEN.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'fonts/**'
      - 'tools/build-www.mjs'
      - '.github/workflows/sync-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-website
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web application
        run: node tools/build-www.mjs

      - name: Copy auxiliary files and inject redirects
        run: |
          touch dist/.nojekyll
          [ -f privacy.html ] && cp privacy.html dist/

          mkdir -p dist/chained-timers dist/Chained-Timers
          cat << 'EOF' > dist/chained-timers/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Chained Timers</title>
            <meta http-equiv="refresh" content="0; url=https://chainedtimers.github.io/">
            <link rel="canonical" href="https://chainedtimers.github.io/">
            <script>
              window.location.replace("https://chainedtimers.github.io/" + window.location.search + window.location.hash);
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="https://chainedtimers.github.io/">chainedtimers.github.io</a>...</p>
          </body>
          </html>
          EOF

          cp dist/chained-timers/index.html dist/Chained-Timers/index.html

          cat << 'EOF' > dist/404.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Chained Timers</title>
            <script>
              (function() {
                var path = window.location.pathname;
                var match = path.match(/^\/chained-timers(?:\/(.*))?$/i);
                if (match) {
                  var sub = match[1] || '';
                  window.location.replace("https://chainedtimers.github.io/" + sub + window.location.search + window.location.hash);
                  return;
                }
                window.location.replace("https://chainedtimers.github.io/");
              })();
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="https://chainedtimers.github.io/">chainedtimers.github.io</a>...</p>
          </body>
          </html>
          EOF

      - name: Inject analytics script
        if: vars.TIDESIGHT_URL != '' && vars.TIDESIGHT_SITE_ID != ''
        env:
          ANALYTICS_URL: ${{ vars.TIDESIGHT_URL }}
          ANALYTICS_SITE: ${{ vars.TIDESIGHT_SITE_ID }}
          ANALYTICS_ROOT: dist
        run: |
          python3 - <<'PY'
          # Tags every HTML page published from ANALYTICS_ROOT. A page without </head>
          # fails the deploy instead of going out untracked; a small redirect page is
          # left alone (the page it leads to is counted).
          import os, pathlib, re, sys
          url, site = os.environ["ANALYTICS_URL"], os.environ["ANALYTICS_SITE"]
          root = pathlib.Path(os.environ["ANALYTICS_ROOT"])
          tag = f'  <script async src="{url}" data-site="{site}"></script>\n'
          redirect = re.compile(r"""http-equiv=["']?refresh|location\.replace\(""", re.I)
          tagged, redirects, missing = [], [], []
          for p in sorted(root.rglob("*.html")):
              rel = p.relative_to(root)
              if any(part.startswith(".") or part == "node_modules" for part in rel.parts):
                  continue
              html = p.read_text(encoding="utf-8")
              if url in html:
                  tagged.append(rel.as_posix())
                  continue
              if redirect.search(html) and len(html) < 4000:
                  redirects.append(rel.as_posix())
                  continue
              head = re.search(r"</head\s*>", html, re.I)
              if not head:
                  missing.append(rel.as_posix())
                  continue
              p.write_text(html[:head.start()] + tag + html[head.start():], encoding="utf-8")
              tagged.append(rel.as_posix())
          print("Tagged:", *tagged, sep="\n  ")
          if redirects:
              print("Redirect pages, not tagged:", *redirects, sep="\n  ")
          if missing:
              print("::error::No </head> to tag in: " + ", ".join(missing))
              sys.exit(1)
          if not tagged:
              print("::error::No page was tagged under " + str(root))
              sys.exit(1)
          PY

      - name: Mirror to chainedtimers.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN_CHAINED_TIMERS || secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: chainedtimers/chainedtimers.github.io
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          user_name: 'chainedtimers-bot'
          user_email: 'bot@users.noreply.github.com'
          commit_message: 'Sync from chainedtimers/chained-timers@${{ github.sha }}'
